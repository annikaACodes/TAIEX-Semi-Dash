name: Update live monthly revenue

on:
  schedule:
    # Companies normally file during the first half of the month.
    - cron: "7,37 * 1-16 * *"
    # Continue checking for late filings and restatements.
    - cron: "17 0,6,12,18 17-31 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: live-monthly-revenue
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run parser and forecast tests
        run: node --test test/*.test.mjs

      - name: Refresh official USD/TWD reference rate
        run: node scripts/update-exchange-rate.mjs

      - name: Poll official sources and update SQLite
        run: node scripts/update-live-data.mjs

      - name: Regenerate website data
        run: node web/scripts/build-dashboard-data.mjs

      - name: Sync the live website dataset
        shell: bash
        env:
          DASHBOARD_SYNC_URL: ${{ secrets.DASHBOARD_SYNC_URL }}
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
        run: |
          if git diff --quiet -- taiwan_semiconductor_companies.sqlite web/public/data; then
            echo "No website data changed."
            exit 0
          fi

          if [[ -z "$DASHBOARD_SYNC_URL" || -z "$DASHBOARD_SYNC_TOKEN" ]]; then
            echo "Dashboard sync secrets are not configured; bundled data remains available."
            exit 0
          fi

          curl --fail-with-body --retry 3 --retry-all-errors \
            --request PUT \
            --header "Authorization: Bearer ${DASHBOARD_SYNC_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Content-Encoding: gzip" \
            --data-binary @web/public/data/dashboard-bundle.json.gz \
            "${DASHBOARD_SYNC_URL%/}/api/dashboard-bundle"

      - name: Commit a meaningful data change
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- taiwan_semiconductor_companies.sqlite web/public/data; then
            echo "No relevant official-source or dashboard change was found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "taiwan-revenue-bot"
          git config user.email "taiwan-revenue-bot@users.noreply.github.com"
          git add -- taiwan_semiconductor_companies.sqlite web/public/data
          git commit -m "Update live Taiwan monthly revenue"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the updated dashboard
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-dashboard.yml --ref "$GITHUB_REF_NAME"
